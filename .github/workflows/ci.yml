name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Verify executable-proof sandbox
        run: npm run verify:demo
      - name: Print proof artifact on failure
        if: failure()
        run: cat .patchproof/artifacts/proof-report.json || true
      - name: Self scan
        run: node bin/patchproof.js scan . --offline
