name: PatchProof Security Gate
description: Evidence-first security analysis for AI-era pull requests
author: PatchProof
branding:
  icon: shield
  color: purple
inputs:
  offline:
    description: Disable registry verification
    required: false
    default: "false"
  proof_manifest:
    description: Optional path to a v1 proof manifest. Proofs run in a locked-down Docker container.
    required: false
    default: ""
  proof_bundle_sha256:
    description: Expected SHA-256 of the manifest and every declared proof file; required for pull-request proofs
    required: false
    default: ""
outputs:
  passed:
    description: Whether the configured security policy passed
  findings:
    description: Total number of findings
  sarif:
    description: Path to the SARIF report
  proof_report:
    description: Path to the executable-proof JSON artifact, when enabled
runs:
  using: node20
  main: src/action.js
